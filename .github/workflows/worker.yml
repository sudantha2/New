name: EncodeWorker
on:
  workflow_dispatch:
    inputs:
      vps_url:
        description: "VPS Webhook URL"
        required: true
        type: string
      account_id:
        description: "Account Label"
        required: true
        type: string

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        worker_num: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Fast FFmpeg Check & Run Dynamic Worker
        env:
          VPS_URL: ${{ inputs.vps_url }}
          ACCOUNT_ID: ${{ inputs.account_id }}
          WORKER_NUM: ${{ matrix.worker_num }}
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ --strip-components=2 -C /usr/local/bin/ --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          fi
          curl -sSf "$VPS_URL/script/worker.py" -o /tmp/worker.py
          python3 -u /tmp/worker.py
